<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS Department Chatbot — SECAB Institute</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: 'Segoe UI', Arial, sans-serif;
        background: #f5f6fa;
        display: flex;
        justify-content: center;
        min-height: 100vh;
    }
    .app {
        width: 100%;
        max-width: 820px;
        display: flex;
        flex-direction: column;
        height: 100vh;
        background: #f5f6fa;
    }
    header {
        background: linear-gradient(90deg, #1e3c72, #2a5298);
        color: white;
        padding: 14px 20px;
        display: flex;
        align-items: center;
        gap: 14px;
    }
    header .title { font-size: 18px; font-weight: 700; flex: 1; }
    header .mode-badge {
        font-size: 12px;
        background: rgba(255,255,255,0.15);
        border: 1px solid rgba(255,255,255,0.3);
        padding: 4px 10px;
        border-radius: 6px;
    }
    header button {
        background: rgba(255,255,255,0.15);
        color: white;
        border: 1px solid rgba(255,255,255,0.3);
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 13px;
    }
    header button:hover { background: rgba(255,255,255,0.25); }

    #chat-area {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .msg-row { display: flex; align-items: flex-end; gap: 8px; }
    .msg-row.user { justify-content: flex-end; }
    .avatar {
        width: 32px; height: 32px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 15px; color: white; flex-shrink: 0;
    }
    .avatar.bot { background: #0052CC; }
    .avatar.user { background: #4caf50; }
    .bubble {
        max-width: 70%;
        padding: 10px 14px;
        border-radius: 14px;
        font-size: 15px;
        line-height: 1.4;
        color: #1a1a1a;
    }
    .bubble.bot { background: white; border: 1px solid #e5e7eb; }
    .bubble.user { background: #dcf8c6; }
    .bubble .sources {
        margin-top: 6px;
        font-size: 11px;
        font-style: italic;
        color: #6b7280;
    }
    .bubble .time {
        margin-top: 4px;
        font-size: 10px;
        color: #9ca3af;
        text-align: right;
    }
    .typing .bubble { font-style: italic; color: #6b7280; }

    #input-bar {
        display: flex;
        gap: 8px;
        padding: 14px;
        background: white;
        border-top: 1px solid #e5e7eb;
    }
    #input-bar input {
        flex: 1;
        padding: 12px 14px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 15px;
    }
    #input-bar button {
        background: #007bff;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 0 20px;
        font-weight: 600;
        cursor: pointer;
    }
    #input-bar button:disabled { background: #9db8d8; cursor: not-allowed; }
</style>
</head>
<body>
<div class="app">
    <header>
        <div class="title">🎓 Computer Science Department Chatbot</div>
        <div class="mode-badge">AI mode: {{ "ON (Ollama)" if ai_mode else "OFF" }}</div>
        <a href="/analytics" style="color:white; font-size:13px; text-decoration:none; background: rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.3); border-radius:6px; padding:6px 12px;">📊 Analytics</a>
        <button onclick="clearChat()">Clear Chat</button>
    </header>

    <div id="chat-area"></div>

    <div id="input-bar">
        <input type="text" id="message-input" placeholder="Type your question about the CS department..." autocomplete="off">
        <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
const chatArea = document.getElementById('chat-area');
const input = document.getElementById('message-input');
const sendBtn = document.getElementById('send-btn');

function nowTime() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function addMessage(text, isUser, sources, isTyping) {
    const row = document.createElement('div');
    row.className = 'msg-row ' + (isUser ? 'user' : 'bot') + (isTyping ? ' typing' : '');

    const avatar = document.createElement('div');
    avatar.className = 'avatar ' + (isUser ? 'user' : 'bot');
    avatar.textContent = isUser ? '🧑' : '🎓';

    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + (isUser ? 'user' : 'bot');

    const textDiv = document.createElement('div');
    textDiv.textContent = text;
    bubble.appendChild(textDiv);

    if (sources && sources.length) {
        const src = document.createElement('div');
        src.className = 'sources';
        src.textContent = '📄 Based on: ' + sources.join('; ');
        bubble.appendChild(src);
    }
    if (!isTyping) {
        const time = document.createElement('div');
        time.className = 'time';
        time.textContent = nowTime();
        bubble.appendChild(time);
    }

    if (isUser) {
        row.appendChild(bubble);
        row.appendChild(avatar);
    } else {
        row.appendChild(avatar);
        row.appendChild(bubble);
    }

    chatArea.appendChild(row);
    chatArea.scrollTop = chatArea.scrollHeight;
    return row;
}

async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, true);
    input.value = '';
    input.disabled = true;
    sendBtn.disabled = true;

    const typingRow = addMessage('Typing...', false, null, true);
    const bubble = typingRow.querySelector('.bubble');
    const textDiv = bubble.querySelector('div');
    let started = false;
    let fullText = '';
    let sources = [];

    try {
        const resp = await fetch('/api/chat/stream', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text })
        });

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });

            let lines = buffer.split('\n');
            buffer = lines.pop(); // last (possibly incomplete) line stays in buffer

            for (const line of lines) {
                if (!line.trim()) continue;
                const event = JSON.parse(line);
                if (event.type === 'token') {
                    if (!started) {
                        started = true;
                        typingRow.classList.remove('typing');
                    }
                    fullText += event.text;
                    textDiv.textContent = fullText;
                    chatArea.scrollTop = chatArea.scrollHeight;
                } else if (event.type === 'done') {
                    sources = event.sources || [];
                }
            }
        }

        if (sources.length) {
            const src = document.createElement('div');
            src.className = 'sources';
            src.textContent = '📄 Based on: ' + sources.join('; ');
            bubble.appendChild(src);
        }
        const time = document.createElement('div');
        time.className = 'time';
        time.textContent = nowTime();
        bubble.appendChild(time);

    } catch (e) {
        textDiv.textContent = 'Could not reach the server. Please try again.';
        typingRow.classList.remove('typing');
    }

    input.disabled = false;
    sendBtn.disabled = false;
    input.focus();
}

async function clearChat() {
    await fetch('/api/clear', { method: 'POST' });
    chatArea.innerHTML = '';
    addMessage("Chat cleared. How can I help you today?", false);
}

input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
});

// Welcome message
addMessage("Hello! I'm the CS Department FAQ chatbot. I can answer questions about admissions, courses, faculty, and career opportunities. How can I help you today?", false);
</script>
</body>
</html>
